name: Verify deterministic contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # Windows TEMP can contain an 8.3 alias. Keep path guards intact and
      # point fixture directories at the runner's canonical temporary path.
      - name: Use canonical temporary paths
        run: node -e "const fs=require('node:fs'); const root=fs.realpathSync.native(process.env.RUNNER_TEMP); fs.appendFileSync(process.env.GITHUB_ENV,['TEMP','TMP','TMPDIR'].map(k=>k+'='+root).join('\n')+'\n');"
      - run: npm ci
      - run: npm test
